    <script type="module">
      const unpack = async (id) => {
        const base64 = document.getElementById(id).content.textContent.trim();
        const binary = atob(base64);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).text();
      };

      try {
        const [css, javascript] = await Promise.all([
          unpack("gzip-css"),
          unpack("gzip-js"),
        ]);
        const style = document.createElement("style");
        style.textContent = css;
        document.head.append(style);

        const moduleUrl = URL.createObjectURL(
          new Blob([javascript], { type: "text/javascript" }),
        );
        try {
          await import(moduleUrl);
        } finally {
          URL.revokeObjectURL(moduleUrl);
        }
      } catch (error) {
        document.body.innerHTML =
          '<main style="max-width:680px;margin:64px auto;padding:24px;font-family:sans-serif;line-height:1.7">' +
          '<h1>無法啟動工具</h1><p>這個瀏覽器不支援內建的 gzip 解壓縮功能，請改用新版 Chrome、Edge、Firefox 或 Safari。</p></main>';
        console.error(error);
      }
    </script>
    
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>RG操作整理工具</h1>
          <p>操作資料與存取碼只在本機處理，不會連線或上傳。</p>
        </div>
        <span class="offline-mark"><i></i>本機處理</span>
      </header>

      <section class="tool-grid">
        <article class="card">
          <div class="step">01</div>
          <h2>操作資料輸入</h2>
          <p class="description">選擇操作文件，輸入存取碼，產生輸出資料。</p>

          <label class="file-picker" for="source-file">
            <strong id="source-file-label">選擇操作文件</strong>
            <span>TXT 或其他純文字格式</span>
          </label>
          <input id="source-file" class="hidden-input" type="file" accept="text/plain,.txt,.log,.csv" />

          <label class="field">
            <span>輸入存取碼</span>
            <input id="encode-password" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 個字元" />
          </label>

          <button id="encode-button" class="primary" disabled>產生輸出資料</button>
          <div id="encode-status" class="status" aria-live="polite"></div>

          <div id="encode-result" class="result hidden">
            <div>
              <strong id="encode-summary"></strong>
              <span id="encode-detail"></span>
            </div>
            <button id="download-package" class="secondary">下載輸出資料</button>
          </div>
        </article>

        <article class="card">
          <div class="step">02</div>
          <h2>操作資料還原</h2>
          <p class="description">選擇完整輸出資料，輸入存取碼，還原操作文件。</p>

          <label class="file-picker" for="output-files">
            <strong id="output-files-label">選擇輸出資料</strong>
            <span>可一次選取多個輸出檔案</span>
          </label>
          <input id="output-files" class="hidden-input" type="file" accept="image/png,image/jpeg,image/webp" multiple />

          <label class="field">
            <span>輸入存取碼</span>
            <input id="decode-password" type="password" autocomplete="current-password" placeholder="輸入原本的存取碼" />
          </label>

          <button id="decode-button" class="primary" disabled>還原操作文件</button>
          <div id="decode-status" class="status" aria-live="polite"></div>

          <div id="decode-result" class="result hidden">
            <div>
              <strong id="decode-summary"></strong>
              <span>資料校驗成功</span>
            </div>
            <button id="download-file" class="secondary">下載操作文件</button>
          </div>
        </article>
      </section>

      <footer>壓縮 → 加密 → 校驗 → 分段輸出</footer>
    </main>
  </body>
</html>
